<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat với Tài liệu PDF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .chat-history::-webkit-scrollbar {
            width: 8px;
        }
        .chat-history::-webkit-scrollbar-track {
            background: #f0f0f5;
            border-radius: 10px;
        }
        .chat-history::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .chat-history::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="font-inter bg-gray-100 min-h-screen flex items-start justify-center p-4">
    <div class="flex flex-col md:flex-row w-full max-w-7xl bg-white rounded-2xl shadow-xl overflow-hidden min-h-[80vh]">
        <!-- Sidebar -->
        <div class="w-full md:w-64 bg-gray-800 text-white p-6 flex flex-col justify-between rounded-t-2xl md:rounded-l-2xl md:rounded-tr-none">
            <div>
                <h1 class="text-2xl font-bold mb-6 flex items-center">
                    <i class="fas fa-file-pdf text-red-400 mr-3"></i> PDF Chat
                </h1>
                <button onclick="location.reload()" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-semibold transition duration-300 shadow-md flex items-center justify-center mb-4">
                    <i class="fas fa-sync-alt mr-2"></i> Làm mới
                </button>
            </div>
            <div class="mt-8">
                <p class="text-sm text-gray-300">Dữ liệu được lấy từ file PDF có sẵn.</p>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col p-6">
            <h2 class="text-3xl font-extrabold text-gray-900 mb-6 text-center md:text-left">Chat với Tài liệu</h2>

            {% if answer %}
            <div class="chat-history flex-1 overflow-y-auto pr-2 mb-6 space-y-4">
                <div class="flex justify-end">
                    <div class="bg-blue-500 text-white p-3 rounded-xl rounded-br-none max-w-lg shadow-sm">
                        {{ question }}
                    </div>
                </div>
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-bl-none max-w-lg shadow-sm">
                        {{ answer }}
                    </div>
                </div>
            </div>
            {% else %}
            <div class="chat-history flex-1 overflow-y-auto pr-2 mb-6 space-y-4">
                <div class="flex justify-start">
                    <div class="bg-gray-200 text-gray-800 p-3 rounded-xl rounded-bl-none max-w-lg shadow-sm">
                        Chào bạn! Tôi có thể giúp gì cho bạn hôm nay?
                    </div>
                </div>
            </div>
            {% endif %}

            <!-- Message Input -->
            <form method="POST" class="relative">
                <input type="text" name="question" placeholder="Nhập câu hỏi của bạn..."
                       class="w-full pl-5 pr-12 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-200 shadow-md" required>
                <button type="submit"
                        class="absolute right-3 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-full transition duration-300 shadow-lg flex items-center justify-center w-9 h-9">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
